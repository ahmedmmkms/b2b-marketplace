components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        data:
          type: object
          description: Response data payload
          example: {}
        success:
          type: boolean
          description: Whether the request was successful
          example: true
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the response
          example: "2025-10-19T06:30:09.284038836Z"
        metadata:
          type: object
          description: Additional metadata
          example: {"message": "Operation successful"}
        error:
          type: object
          description: Error details if success is false
          properties:
            type:
              type: string
              example: "about:blank"
            title:
              type: string
              example: "Not Found"
            status:
              type: integer
              example: 404
            detail:
              type: string
              example: "Resource not found"
            instance:
              type: string
              example: "/api/resource/123"

    Vendor:
      type: object
      properties:
        id:
          type: string
          example: "01F123456789ABCDEFGH"
        businessName:
          type: string
          example: "Tech Vendor Inc."
        email:
          type: string
          format: email
          example: "contact@techvendor.com"
        phone:
          type: string
          example: "+1234567890"
        address:
          type: object
          example:
            street: "123 Tech Street"
            city: "Tech City"
            state: "TC"
            postalCode: "12345"
            country: "US"
        taxId:
          type: string
          example: "TV123456789"
        businessLicenseNo:
          type: string
          example: "BL123456789"
        registrationDate:
          type: string
          format: date
          example: "2023-01-01"
        vendorStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED, SUSPENDED, CLOSED]
          example: "PENDING"
        kycVerified:
          type: boolean
          example: false
        kycVerifiedAt:
          type: string
          format: date
          example: "2023-01-02"
        kycVerifiedBy:
          type: string
          example: "Admin User"

    ProductRequest:
      type: object
      properties:
        name:
          type: string
          example: "Wireless Headphones"
        description:
          type: string
          example: "High quality wireless headphones"
        sku:
          type: string
          example: "WH-12345"
        vendorId:
          type: string
          example: "01F123456789ABCDEFGH"
        price:
          $ref: '#/components/schemas/Money'
        stockQuantity:
          type: integer
          example: 100
        minOrderQuantity:
          type: integer
          example: 1
        weight:
          type: number
          format: decimal
          example: 0.5
        dimensionsLength:
          type: number
          format: decimal
          example: 20.0
        dimensionsWidth:
          type: number
          format: decimal
          example: 15.0
        dimensionsHeight:
          type: number
          format: decimal
          example: 8.0
        productStatus:
          type: string
          enum: [DRAFT, ACTIVE, INACTIVE, DISCONTINUED]
          example: "ACTIVE"
        isActive:
          type: boolean
          example: true

    ProductAttribute:
      type: object
      properties:
        id:
          type: string
          example: "01F123456789ABCDEFGH"
        name:
          type: string
          example: "color"
        displayName:
          type: string
          example: "Color"
        description:
          type: string
          example: "The color of the product"
        attributeType:
          type: string
          enum: [TEXT, NUMBER, BOOLEAN, DATE, SELECT]
          example: "SELECT"
        isRequired:
          type: boolean
          example: false
        isFilterable:
          type: boolean
          example: true
        sortOrder:
          type: integer
          example: 1

    MediaAsset:
      type: object
      properties:
        id:
          type: string
          example: "01F123456789ABCDEFGH"
        originalFilename:
          type: string
          example: "product-image.jpg"
        storagePath:
          type: string
          example: "/images/products/12345.jpg"
        contentType:
          type: string
          example: "image/jpeg"
        fileSize:
          type: integer
          example: 102400
        altText:
          type: string
          example: "Product image"
        caption:
          type: string
          example: "High quality product image"
        mediaType:
          type: string
          enum: [IMAGE, VIDEO, DOCUMENT, OTHER]
          example: "IMAGE"

    ProductMedia:
      type: object
      properties:
        id:
          type: string
          example: "01F123456789ABCDEFGH"
        productId:
          type: string
          example: "01F987654321ZYXWVU"
        mediaAssetId:
          type: string
          example: "01F555555555555555"
        displayOrder:
          type: integer
          example: 1
        isPrimary:
          type: boolean
          example: true
        altTextOverride:
          type: string
          example: "Primary product image"

    Money:
      type: object
      properties:
        amount:
          type: string
          example: "29.99"
        currency:
          type: string
          example: "USD"

security:
  - bearerAuth: []
