# Application Configuration
server.port=8080
spring.application.name=b2b-marketplace

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics, prometheus
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging Configuration
logging.level.com.p4.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
# Include correlation ID in logs
logging.pattern.level=%5p [${spring.application.name:application},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]

# Micrometer Configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# CORS Configuration
app.cors.allowed-origins=https://b2b-marketplace.pages.dev,http://localhost:3000

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Seed Configuration
app.seed.csv-path=seed/products.csv
# Set to true to enable seeding on startup (defaults to false)
app.seed.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}
