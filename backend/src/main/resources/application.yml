spring:
  application:
    name: p4-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/p4_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: P4HikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      validation-timeout: 5000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none  # Let Flyway handle schema changes, not Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Backblaze B2 Configuration for Media Storage
b2:
  account:
    id: ${B2_ACCOUNT_ID:}
  application:
    key:
      id: ${B2_APPLICATION_KEY_ID:}
  secret:
    access:
      key: ${B2_APPLICATION_KEY:}
  bucket:
    name: ${B2_BUCKET:p4-prod-assets}
  endpoint:
    url: ${B2_ENDPOINT_URL:https://api.backblazeb2.com}

# Server Configuration
server:
  port: 8080

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true
  health:
    mail:
      enabled: false

# Feature Flags Configuration
feature:
  flags:
    catalog:
      publicBrowse: ${FEATURE_CATALOG_PUBLIC_BROWSE:false}
    search:
      enabled: ${FEATURE_SEARCH_ENABLED:false}
    rfq:
      enabled: ${FEATURE_RFQ_ENABLED:false}
    quote:
      vendorConsole:
        enabled: ${FEATURE_QUOTE_VENDOR_CONSOLE_ENABLED:false}
    orders:
      checkout: ${FEATURE_ORDERS_CHECKOUT:false}
    payments:
      gateway1: ${FEATURE_PAYMENTS_GATEWAY1:false}
    wallet:
      basic: ${FEATURE_WALLET_BASIC:false}
    invoice:
      vat: ${FEATURE_INVOICE_VAT:false}
    loyalty:
      core: ${FEATURE_LOYALTY_CORE:false}
    credit:
      controls: ${FEATURE_CREDIT_CONTROLS:false}

# Database Seeding Configuration
app:
  seed:
    enabled: ${SEED_ENABLED:false}

---
spring:
  config:
    activate:
      on-profile: prod
  main:
    allow-bean-definition-overriding: true  # Allow bean overriding as mentioned in RESOLUTION_SUMMARY.md
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-damp-feather-adc322wz-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_QTE70VJgbcdp}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: P4HikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      leak-detection-threshold: 60000
      validation-timeout: 5000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none  # Let Flyway handle schema changes, not Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false  # Disable SQL logging in production
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Base schema from existing database"

# Feature flags for production
feature:
  flags:
    catalog:
      publicBrowse: ${FEATURE_CATALOG_PUBLIC_BROWSE:true}
    search:
      enabled: ${FEATURE_SEARCH_ENABLED:true}
    rfq:
      enabled: ${FEATURE_RFQ_ENABLED:true}
    quote:
      vendorConsole:
        enabled: ${FEATURE_QUOTE_VENDOR_CONSOLE_ENABLED:true}
    orders:
      checkout: ${FEATURE_ORDERS_CHECKOUT:true}
    payments:
      gateway1: ${FEATURE_PAYMENTS_GATEWAY1:true}
    wallet:
      basic: ${FEATURE_WALLET_BASIC:true}
    invoice:
      vat: ${FEATURE_INVOICE_VAT:true}
    loyalty:
